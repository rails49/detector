[project]
name = "rails49-detector"
version = "0.0.2"
description = "The rails49 occupancy detector's runtime in Python: frame to L0, with no Torch"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.12"
dependencies = ["numpy>=2.3", "onnxruntime>=1.25.1", "pyvips[binary]>=3.0"]

[project.optional-dependencies]
openvino = ["openvino>=2025.0"]

[project.urls]
Repository = "https://github.com/rails49/detector"
Issues = "https://github.com/rails49/detector/issues"

[dependency-groups]
dev = ["black>=25.1", "onnx>=1.16", "pyright>=1.1.400", "pytest>=8.3", "ruff>=0.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/detector"]

# The sdist holds a copy of the repository's LICENSE, which the wheel built from
# it lists as its license file.
[tool.hatch.build.targets.sdist.force-include]
"../../LICENSE" = "LICENSE"

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["src", "tests"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
